spring:
  application:
    name: alert-platform
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alerts}
    username: ${DB_USER:alerts}
    password: ${DB_PASSWORD:alerts}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      slackWebhookAna: ${SLACK_WEBHOOK_ANA:}
      slackWebhookCarla: ${SLACK_WEBHOOK_CARLA:}
      slackWebhookDiego: ${SLACK_WEBHOOK_DIEGO:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: alert-platform
      auto-offset-reset: earliest
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ingestion:
  usgs:
    feed-url: ${USGS_FEED_URL:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson}
    poll-interval-ms: ${USGS_POLL_INTERVAL_MS:60000}
